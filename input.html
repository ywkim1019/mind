<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>하루사용 측정기</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      text-align: c기</h1>
    <form id="userForm">
      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" required placeholder="이름을 입력하세요" />
      </div>
      <div class="form-group">
        <label for="gender">성별</label>
        <input type="text" id="gender" name="gender" required placeholder="남 / 여" />
      </div>
      <div class="form-group">
        <label for="birthdate">생년월일</label>
        <input type="date" id="birthdate" name="birthdate" required />
      </div>
      <div class="form-group">
        <label for="heartRate">건강상태</label>
        <input type="number" id="heartRate" name="heartRate" required placeholder="예: 좋음,나쁨 등 />
      </div>
      <div class="form-group">
        <label for="bloodPressure">결시</label>
        <input type="number" id="bloodPressure" name="bloodPressure" required placeholder="예:없음" />
      </div>
      <button type="submit">제출</button>
    </form>
  </div>
    <form id="userForm">
      <div class="form-group">
        <label for="name">거주지역</label>
        <input type="text" id="name" name="거주지역을 입력하세요" required placeholder="거주지역을 입력하세요" />
      </div>
      <div class="form-group">
        <label for="gender">세부 정보를 입력해주세요</label>
        <input type="text" id="gender" name="세부 정보를 입력해주세요" required placeholder="세부 정보를 입력해주세요" />
      </div>
      <div class="form-group">
        <label for="birthdate">이동시간 </label>
        <input type="date" id="birthdate" name="이동시간" required />
      </div>
      <div class="form-group">
        <label for="heartRate">이동경로</label>
        <input type="number" id="heartRate" name="이동경로" required placeholder="이동경로" />
      </div>
      <div class="form-group">
        <label for="bloodPressure">의뢰 날짜</label>
        <input type="number" id="bloodPressure" name="의뢰날짜를 입력하세요" required placeholder="의뢰날짜를 입력하세요" />
      </div>
      <button type="submit">제출</button>
    </form>
  </div>
  <script>
    document.getElementById('userForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const gender = document.getElementById('gender').value.trim();
      const birthdate = document.getElementById('birthdate').value;
      const heartRate = document.getElementById('heartRate').value;
      const bloodPressure = document.getElementById('bloodPressure').value;

      const scriptURL = "https://script.google.com/macros/s/AKfycbwh7HzPQRhmbXq_LFAj1QGY-BJrfPBSk7VWaphz9Jr8kw7KlagqxovX7UEt5D26LWjEOQ/exec";

      const formData = new FormData();
      formData.append("name", name);
      formData.append("gender", gender);
      formData.append("birthdate", birthdate);
      formData.append("heartRate", heartRate);
      formData.append("bloodPressure", bloodPressure);

      fetch(scriptURL, {
        method: "POST",
        body: formData,
      })
        .then(response => {
          if (response.ok) {
            alert("입력이 성공적으로 저장되었습니다.");
            document.getElementById("userForm").reset();
          } else {
            alert("저장 중 오류가 발생했습니다.");
          }
        })
        .catch(error => {
          alert("오류 발생: " + error.message);
        });
    });
  </script>
</body>
</html>
